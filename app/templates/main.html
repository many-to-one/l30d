<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Batch Compression</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <title>Last 30 Days – Trendy i Podsumowania</title>
    <style>
        
    </style>
</head>
<body>
    <header>
        <h1>Last 30 Days 🔍</h1>
        <p>Znajdź najgorętsze tematy z Reddit i Hacker News z ostatnich 30 dni</p>
    </header>

    <main>

        <div id="loading" style="display:none; text-align:center; margin-top:1rem;">
            <div class="spinner"></div>
            <p>🤖 Analizuję dane z ostatnich 30 dni...</p>
        </div>

        <form id="searchForm">
            <input type="text" id="query" placeholder="Wpisz temat, np. 'AI', 'Python', 'startup'..." required>
            <button type="submit">Szukaj</button>
        </form>

        <div id="results" class="results"></div>
        <div id="summary" class="summary" style="display:none;"></div>
    </main>

    <script>
        const form = document.getElementById('searchForm');
        const resultsDiv = document.getElementById('results');
        const summaryDiv = document.getElementById('summary');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('query').value;
            resultsDiv.innerHTML = '<p>⏳ Pobieranie danych...</p>';
            summaryDiv.style.display = 'none';

            const res = await fetch(`/last30days?query=${encodeURIComponent(query)}`);
            const data = await res.json();

            resultsDiv.innerHTML = '';
            data.results.forEach(item => {
                const el = document.createElement('div');
                el.className = 'result-item';
                el.innerHTML = `
                    <a href="${item.url}" target="_blank"><h3>${item.title}</h3></a>
                    <p>💬 Komentarze: ${item.comments} | 👍 Score: ${item.score}</p>
                    <small>Źródło: ${item.source}</small>
                `;
                resultsDiv.appendChild(el);
            });

            summaryDiv.textContent = data.summary;
            summaryDiv.style.display = 'block';
        });
    </script>
</body>
</html>
